[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bugfix-agent"
version = "0.2.0"
description = "Two independent products: Agent-1 defect-batch CLI, and a LangGraph Agent-2/3 platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
agent1 = ["openpyxl>=3.1"]
platform = ["langgraph>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "langgraph>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
sdk = ["claude-agent-sdk>=0.1"]
http = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
bugfix-agent = "bugfix_agent1.cli:main"
bugfix-platform = "bugfix_platform.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["contracts", "agent1", "platform"]

[tool.hatch.build.targets.wheel]
only-include = [
  "contracts/bugfix_contracts",
  "agent1/bugfix_agent1",
  "platform/bugfix_platform",
]

[tool.hatch.build.targets.wheel.sources]
"contracts" = ""
"agent1" = ""
"platform" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contracts", "agent1", "platform", "."]
